spring.application.name=e-financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

app.cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:5501}

app.email.resend.api-key=${RESEND_API_KEY:}
app.email.remetente=${EMAIL_REMETENTE:onboarding@resend.dev}
app.frontend.url=${FRONTEND_URL:http://localhost:5501}
