spring.application.name=e-financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway usa um usuário próprio (dono do banco, pode criar/alterar tabelas); a aplicação usa
# DB_USUARIO, restrito a ler/gravar dados. Sem as variáveis, cai no mesmo usuário da aplicação.
spring.flyway.user=${DB_FLYWAY_USUARIO:${DB_USUARIO}}
spring.flyway.password=${DB_FLYWAY_SENHA:${DB_SENHA}}

# Atrás do proxy do Render, o IP real do cliente vem no X-Forwarded-For (usado no limite de requisições)
server.forward-headers-strategy=native

# Foto de perfil: o front já recorta pra 512x512 (~50 KB); o limite só barra envio direto abusivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}

app.cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:http://localhost:5501}

app.email.resend.api-key=${RESEND_API_KEY:}
app.email.remetente=${EMAIL_REMETENTE:onboarding@resend.dev}
app.frontend.url=${FRONTEND_URL:http://localhost:5501}

app.cloudinary.url=${CLOUDINARY_URL:}
